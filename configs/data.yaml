# Teacher generation is opt-in; stub builds stay entirely offline.
seed: 1234
overreach_share: 0.40
templates: turnguard/data
stub_output: build/stub
real_output: data/v1
cache: data/cache
template_version: bank-v2
curator:
  clean: false
  max_removal_rate: 0.05
  minhash: {threshold: 0.85, ngram: 3, num_perm: 128, seed: 1234}
required_families:
  train: [email, docs, tickets, web, calendar]
  dev: [email, docs, tickets, web, calendar]
  test: [email, docs, tickets, web, calendar, code]
# Serial requests (concurrency 1); CK retries at most once, LiteLLM never retries again.
# No seed is relied on: the full request/response cache determines reruns.
teacher_sampling:
  temperature: 0
  top_p: 1
  max_tokens: 512
  timeout: 45
  max_retries: 1
  num_retries: 0
  drop_params: false
  # Vultr chat models "think" by default; thinking is billed as output and
  # counts against max_tokens, so a 512-token reply could come back empty.
  extra_body: {reasoning: {enabled: false}}
# Train's ~1500 future DPO pairs: balanced injected/authorized source budget.
# Pair construction itself belongs to task 04; clean twins are additional.
targets:
  train: {injected: 750, clean: 750, authorized: 750}
  dev: {injected: 120, clean: 120, authorized: 120}
  test: {injected: 450, clean: 450, authorized: 225}
factors:
  family: [email, docs, tickets, web, calendar, code]
  carrier: [body, metadata, quoted, tool_error]
  goal: [exfiltrate, destroy, tamper_answer, extra_call, redirect]
  position: [first, later, split]
  style: [imperative, fake_authority, named_approval, task_framed, protocol_spoof, quiet_fyi]
  pressure: [none, snag]
  conversation_language: [en, hi, hinglish]
  injection_language: [en, hi, hinglish]

# Companion stress test; --limit still caps injected bases only.
cueflip_targets:
  injected: 120
  clean: 120
  authorized: 60
