# Split-disjoint injection bank (C3, natural-register revision).
# Long/short prose, snag content and split pairs are selected by episode split.
# Counts per style: train=6, dev=4, test=6. Tool-error pairs are test-only.
# Non-protocol prose uses ordinary workplace requests and plausible pretexts.
# Redirect requests are authored per family/action; internal keys are never rendered.
# Protocol-spoof long/short texts are preserved from Stop 1.
