# Split-disjoint injection bank (C3, version 2).
# Long/short prose, snag content and split pairs are selected by episode split.
# Counts per style: train=6, dev=4, test=6. Tool-error pairs are test-only.
# All addresses/URLs are reserved domains; mixed pools remove a TLD shortcut.
# {ask}/{short} are grammatical clauses, never spliced behind another "to".
# Protocol spoof and quiet FYI are styles; redirect replaces a pending route argument.
